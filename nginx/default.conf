server {
    listen 80;
    server_name _;

    location /api/users {
        proxy_pass http://user-service:3001/users;
    }

    location /api/products {
        proxy_pass http://product-service:3002/products;
    }

    location /api/orders {
        proxy_pass http://order-service:3003/orders;
    }

    location /health/users {
        proxy_pass http://user-service:3001/health;
    }

    location /health/products {
        proxy_pass http://product-service:3002/health;
    }

    location /health/orders {
        proxy_pass http://order-service:3003/health;
    }
}
